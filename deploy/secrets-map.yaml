# 机密对照表：本仓服务用到的每个 Secret 键，对应 settings.local.json 里 env 下的哪个键（ADR-0005）。
# 格式与用法见 GoSail 工作空间仓的 deploy/secrets-map.yaml 文件头；推进集群：
#   node <工作空间>/deploy/scripts/secrets.js push --cluster test|prod --map deploy/secrets-map.yaml

secrets:
  # 应用凭证：测试与生产各一套；Redis 密码是区域 Redis 的那一个
  - clusters: [test]
    namespace: dujiao-next
    name: dujiao-next-secrets
    data:
      DB_PASSWORD: GOSAIL_PG_DUJIAO_TEST_PASSWORD
      REDIS_PASSWORD: GOSAIL_REDIS_CN_TEST_PASSWORD
      APP_SECRET_KEY: GOSAIL_DUJIAO_TEST_APP_SECRET_KEY
      JWT_SECRET: GOSAIL_DUJIAO_TEST_JWT_SECRET
      USER_JWT_SECRET: GOSAIL_DUJIAO_TEST_USER_JWT_SECRET
      BOOTSTRAP_DEFAULT_ADMIN_PASSWORD: GOSAIL_DUJIAO_TEST_ADMIN_PASSWORD

  - clusters: [prod]
    namespace: dujiao-next
    name: dujiao-next-secrets
    data:
      DB_PASSWORD: GOSAIL_PG_DUJIAO_PROD_PASSWORD
      REDIS_PASSWORD: GOSAIL_REDIS_CN_PASSWORD
      # APP_SECRET_KEY 加密库里的敏感字段：搬数据时必须沿用现网的值，换了就解不开
      APP_SECRET_KEY: GOSAIL_DUJIAO_PROD_APP_SECRET_KEY
      JWT_SECRET: GOSAIL_DUJIAO_PROD_JWT_SECRET
      USER_JWT_SECRET: GOSAIL_DUJIAO_PROD_USER_JWT_SECRET
      BOOTSTRAP_DEFAULT_ADMIN_PASSWORD: GOSAIL_DUJIAO_PROD_ADMIN_PASSWORD
      WEB_ADMIN_PATH: GOSAIL_DUJIAO_PROD_WEB_ADMIN_PATH

  # pg-cn 里两个库各自账号的密码。PG 只在生产集群，两个环境的账号都推进生产集群的 data-cn；
  # 库与账号的声明在工作空间仓（CloudNativePG 的 Database 与 managed roles）。
  - clusters: [test]
    namespace: data-cn
    name: pg-cn-role-dujiao-test
    type: kubernetes.io/basic-auth
    literals:
      username: dujiao_test
    data:
      password: GOSAIL_PG_DUJIAO_TEST_PASSWORD

  - clusters: [prod]
    namespace: data-cn
    name: pg-cn-role-dujiao-prod
    type: kubernetes.io/basic-auth
    literals:
      username: dujiao_prod
    data:
      password: GOSAIL_PG_DUJIAO_PROD_PASSWORD
